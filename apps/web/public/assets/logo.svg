<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="favBg" cx="30%" cy="25%" r="75%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="45%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>

    <!-- Electric Neon Gradient: Cyan to Violet to Fuchsia -->
    <linearGradient id="favNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="48%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Reverse Vivid Gradient for Depth -->
    <linearGradient id="favNeon2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Shimmer Top Arc Highlight -->
    <linearGradient id="favShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Outer Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.9" />
    </linearGradient>

    <!-- Drop Shadow for Letterforms -->
    <filter id="symbolShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#581c87" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Circular Outer Glow Base (No corners, completely round & organic) -->
  <circle cx="256" cy="256" r="236" fill="url(#favBg)" />

  <!-- Smooth Neon Outer Rim -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#ringGrad)" stroke-width="8" />

  <!-- Top Glass Highlight Dome -->
  <ellipse cx="256" cy="140" rx="190" ry="100" fill="url(#favShine)" opacity="0.25" />

  <!-- Central Ambient Neon Burst -->
  <circle cx="256" cy="256" r="130" fill="url(#favNeon)" opacity="0.22" filter="blur(35px)" />

  <!-- Main Monogram Group: Interlinked Curved "O" and "D" with Code Brackets -->
  <g filter="url(#symbolShadow)">
    <!-- Left Curved "O" Wing -->
    <path d="M 235 125 C 150 125, 115 175, 115 256 C 115 337, 150 387, 235 387 C 248 387, 256 377, 256 364 C 256 351, 248 341, 235 341 C 182 341, 160 305, 160 256 C 160 207, 182 171, 235 171 C 248 171, 256 161, 256 148 C 256 135, 248 125, 235 125 Z"
          fill="url(#favNeon)" />

    <!-- Right Curved "D" Wing -->
    <path d="M 275 125 C 360 125, 397 175, 397 256 C 397 337, 360 387, 275 387 C 262 387, 254 377, 254 364 C 254 351, 262 341, 275 341 C 328 341, 352 305, 352 256 C 352 207, 328 171, 275 171 C 262 171, 254 161, 254 148 C 254 135, 262 125, 275 125 Z"
          fill="url(#favNeon2)" />

    <!-- Center Developer Code Brackets: < / > Inside the Circle -->
    <g transform="translate(256, 256)" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- Left Angle < (Smooth Electric Cyan) -->
      <path d="M -34 -24 L -58 0 L -34 24" stroke="url(#favNeon)" stroke-width="15" />
      
      <!-- Sleek Dynamic Center Slash / (Bright White with Glow) -->
      <path d="M 12 -32 L -12 32" stroke="#ffffff" stroke-width="13" opacity="0.95" />

      <!-- Right Angle > (Radiant Violet/Magenta) -->
      <path d="M 34 -24 L 58 0 L 34 24" stroke="url(#favNeon2)" stroke-width="15" />
    </g>

    <!-- Core Center Star Pulse Sparkle -->
    <circle cx="256" cy="256" r="3.5" fill="#ffffff" />
  </g>
</svg>
