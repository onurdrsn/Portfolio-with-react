<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>

    <!-- Primary Neon Gradient (Cyan -> Violet -> Magenta) -->
    <linearGradient id="neonGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="45%" stop-color="#7928ca" />
      <stop offset="100%" stop-color="#ff0080" />
    </linearGradient>

    <!-- Secondary Accent Gradient -->
    <linearGradient id="neonGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Glass Reflection Gradient -->
    <linearGradient id="glassGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur1" />
      <feGaussianBlur stdDeviation="32" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Subtle Drop Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#7c3aed" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Rounded App Tile Container -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2" />

  <!-- Ambient Glow Behind Monogram -->
  <circle cx="256" cy="256" r="140" fill="url(#neonGrad1)" opacity="0.25" filter="blur(40px)" />

  <!-- Monogram Group with Filter -->
  <g filter="url(#dropShadow)">
    
    <!-- Outer "O" Arc (Left Half of Monogram) -->
    <path d="M 230 110 C 130 110, 90 170, 90 256 C 90 342, 130 402, 230 402 C 245 402, 256 391, 256 376 C 256 361, 245 350, 230 350 C 165 350, 142 308, 142 256 C 142 204, 165 162, 230 162 C 245 162, 256 151, 256 136 C 256 121, 245 110, 230 110 Z" 
          fill="url(#neonGrad1)" />

    <!-- Outer "D" Loop (Right Half of Monogram) -->
    <path d="M 270 110 C 370 110, 422 170, 422 256 C 422 342, 370 402, 270 402 L 260 402 C 245 402, 235 391, 235 376 C 235 361, 245 350, 260 350 L 270 350 C 335 350, 370 308, 370 256 C 370 204, 335 162, 270 162 L 260 162 C 245 162, 235 151, 235 136 C 235 121, 245 110, 260 110 Z" 
          fill="url(#neonGrad2)" />

    <!-- Glass Overlay Shimmer -->
    <path d="M 230 110 C 130 110, 90 170, 90 256 C 90 342, 130 402, 230 402 C 245 402, 256 391, 256 376 C 256 361, 245 350, 230 350 L 270 350 C 335 350, 370 308, 370 256 C 370 204, 335 162, 270 162 Z" 
          fill="url(#glassGloss)" opacity="0.6" />

    <!-- Center Developer Bracket: Code Bracket < / > -->
    <g transform="translate(256, 256) scale(1.1)" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- Left Angle Bracket < -->
      <path d="M -42 -22 L -66 0 L -42 22" stroke="url(#neonGrad1)" stroke-width="14" />
      
      <!-- Center Slash / -->
      <path d="M 12 -28 L -12 28" stroke="#ffffff" stroke-width="12" opacity="0.9" />

      <!-- Right Angle Bracket > -->
      <path d="M 42 -22 L 66 0 L 42 22" stroke="url(#neonGrad2)" stroke-width="14" />
    </g>

  </g>
</svg>
